name: Fetch Stock Data

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:          # also allows manual trigger from GitHub

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stock data from Yahoo Finance
        run: python3 fetch_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "Stock Data Bot"
          git config user.email "bot@anna-finance.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update stock data $(date -u +%Y-%m-%d\ %H:%M)" && git push)
