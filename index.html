<script>
// ── CONSTANTS ────────────────────────────────────────────────
const GROUPS={
  "Indices":["^GSPC","^IXIC","^DJI","^GDAXI","^FTSE","^N225"],
  "ETFs":["SPY","QQQ","DIA","IWM","EEM","ACWI","GLD","SLV"],

  "Growth":["AMD","INTC","VRT","TMO","HIMS","LNTH","FSLR","NVO","PYPL","BABA","AOS"]
};
const ALL=Object.values(GROUPS).flat();
const OVERVIEW_TICKERS=["^GSPC","^IXIC","^GDAXI","^N225","BTC-USD","GLD"];
const NAMES={
  "AAPL":"Apple","MSFT":"Microsoft","GOOGL":"Alphabet","AMZN":"Amazon","META":"Meta","NVDA":"Nvidia","TSLA":"Tesla",
  "AMD":"AMD","INTC":"Intel","VRT":"Vertiv","TMO":"Thermo Fisher","HIMS":"Hims & Hers","LNTH":"Lantheus",
  "FSLR":"First Solar","NVO":"Novo Nordisk","PYPL":"PayPal","BABA":"Alibaba","AOS":"A.O. Smith",
  "SPY":"S&P 500 ETF","QQQ":"Nasdaq 100 ETF","DIA":"Dow Jones ETF","IWM":"Russell 2000",
  "EEM":"Emerging Markets","ACWI":"MSCI World","GLD":"Gold ETF","SLV":"Silver ETF",
  "BTC-USD":"Bitcoin","ETH-USD":"Ethereum","SOL-USD":"Solana","XRP-USD":"XRP","HYPE32196-USD":"Hyperliquid",
  "^GSPC":"S&P 500","^IXIC":"Nasdaq","^DJI":"Dow Jones","^GDAXI":"DAX","^FTSE":"FTSE 100","^N225":"Nikkei 225"
};

const TV_SYM={
  "^GSPC":"SP:SPX","^IXIC":"NASDAQ:COMP","^DJI":"DJ:DJI",
  "^GDAXI":"XETR:DAX","^FTSE":"FTSE:UKX","^N225":"INDEX:NKY",
  "BTC-USD":"BITSTAMP:BTCUSD","ETH-USD":"BITSTAMP:ETHUSD",
  "SOL-USD":"COINBASE:SOLUSD","XRP-USD":"BITSTAMP:XRPUSD",
  "HYPE32196-USD":"BINANCE:HYPEUSDT",
};
function toTVSym(s){return TV_SYM[s]||s;}

// ── STATE ────────────────────────────────────────────────────
const S={
  active:"AAPL",stocks:{},tab:"price",range:"3m",aiText:"",aiLoading:false,
  custom:[],liveLoaded:{},
  collapsed:{"Indices":false,"ETFs":true,"Crypto":false,"Mag 7":false,"Growth":true},
  compareWith:"",showFib:false,fgi:{},fgiLoading:false,intraday:{}
};

document.getElementById("dateLabel").textContent=new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
document.getElementById("overviewTime").textContent=new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});

// ── MATH ─────────────────────────────────────────────────────
const sma=(d,p)=>d.map((_,i)=>i<p-1?null:d.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p);
const ema=(d,p)=>{const k=2/(p+1),e=[];d.forEach((v,i)=>e.push(i?v*k+e[i-1]*(1-k):v));return e;};
function calcRSI(c,p=14){return c.map((_,i)=>{if(i<p)return null;let g=0,l=0;for(let j=i-p+1;j<=i;j++){const x=c[j]-c[j-1];x>0?g+=x:l-=x;}return 100-100/(1+g/(l||1e-6));});}
function calcMACD(c){const l=ema(c,12).map((v,i)=>v-ema(c,26)[i]);const s=[...Array(26).fill(null),...ema(l.slice(26),9)];return{line:l,sig:s,hist:l.map((v,i)=>s[i]!=null?v-s[i]:null)};}
function calcBoll(c,p=20,m=2){const sm=sma(c,p);return c.map((_,i)=>{if(!sm[i])return{u:null,mid:null,l:null};const sl=c.slice(i-p+1,i+1),mn=sm[i],std=Math.sqrt(sl.reduce((a,v)=>a+(v-mn)**2,0)/p);return{u:mn+m*std,mid:mn,l:mn-m*std};});}
function calcSignal(rv,mv,price,bv){
  const lr=rv.filter(Boolean).at(-1),lm=mv.hist.filter(Boolean).at(-1),pm=mv.hist.filter(Boolean).at(-2),lb=bv.filter(b=>b.u).at(-1);
  let sc=0;const rs=[];
  if(lr<30){sc+=2;rs.push("RSI oversold");}else if(lr<40){sc+=1;rs.push("RSI low");}else if(lr>70){sc-=2;rs.push("RSI overbought");}else if(lr>60){sc-=1;rs.push("RSI high");}
  if(pm!=null&&lm!=null){if(pm<0&&lm>0){sc+=2;rs.push("MACD Crossover +");}else if(pm>0&&lm<0){sc-=2;rs.push("MACD Crossover -");}else if(lm>0){sc+=1;rs.push("MACD positive");}else{sc-=1;rs.push("MACD negative");}}
  if(lb&&price<=lb.l){sc+=2;rs.push("Price at lower BB");}else if(lb&&price>=lb.u){sc-=2;rs.push("Price at upper BB");}
  if(sc>=3)return{s:"BULLISH",c:"#10b981",i:"▲",sc,rs};
  if(sc<=-3)return{s:"BEARISH",c:"#ef4444",i:"▼",sc,rs};
  return{s:"NEUTRAL",c:"#f59e0b",i:"◆",sc,rs};
}
function fmtPrice(v){if(v==null||!isFinite(v))return"-";if(v>10000)return v.toLocaleString("en-US",{maximumFractionDigits:0});if(v>100)return v.toFixed(2);if(v>1)return v.toFixed(3);return v.toFixed(4);}
function fmtVol(v){if(!v)return"-";if(v>1e9)return(v/1e9).toFixed(2)+"B";if(v>1e6)return(v/1e6).toFixed(1)+"M";if(v>1e3)return(v/1e3).toFixed(0)+"K";return v;}

// ── MOCK DATA ─────────────────────────────────────────────────
function mock(t){
  const b={"AAPL":210,"MSFT":445,"GOOGL":162,"AMZN":198,"META":615,"NVDA":115,"TSLA":290,
    "AMD":360,"INTC":100,"VRT":328,"TMO":455,"HIMS":35,"LNTH":73,"FSLR":170,"NVO":78,"PYPL":75,"BABA":125,"AOS":70,
    "SPY":565,"QQQ":480,"DIA":425,"IWM":205,"EEM":42,"ACWI":115,"GLD":310,"SLV":33,
    "BTC-USD":95000,"ETH-USD":1800,"SOL-USD":145,"XRP-USD":2.2,"HYPE32196-USD":41,
    "^GSPC":5650,"^IXIC":17800,"^DJI":41500,"^GDAXI":18200,"^FTSE":8300,"^N225":38000};
  let p=b[t]||80;const now=new Date(),data=[];
  for(let i=364;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);p*=1+(Math.random()-.48)*.018;const c=+p.toFixed(2);const o=+(p*(1+(Math.random()-.5)*.006)).toFixed(2);const h=+(Math.max(o,c)*(1+Math.random()*.009)).toFixed(2);const l=+(Math.min(o,c)*(1-Math.random()*.009)).toFixed(2);data.push({date:d.toISOString().slice(0,10),o,h,l,c,v:Math.floor(Math.random()*5e6+1e6)});}
  return data;
}

// ── API ───────────────────────────────────────────────────────
const API="https://fulfilling-expression-production-3d1c.up.railway.app";

async function fetchStock(t){
  try{
    const r=await fetch(API+"/stock/"+encodeURIComponent(t)+"?range=5y",{signal:AbortSignal.timeout(10000)});
    if(r.ok){const j=await r.json();if(j.data&&j.data.length>=10){console.log("Railway OK:",t);return j.data;}}
  }catch(e){console.log("Railway failed:",t,e.message);}
  return null;
}

async function fetchIntraday(t,range){
  try{
    const r=await fetch(API+"/stock/"+encodeURIComponent(t)+"?range="+range,{signal:AbortSignal.timeout(8000)});
    if(r.ok){const j=await r.json();if(j.data&&j.data.length>=2)return j.data;}
  }catch(e){}
  return null;
}

// ── PROCESS ───────────────────────────────────────────────────
function processStock(raw){
  const closes=raw.map(d=>d.c),vols=raw.map(d=>d.v||0);
  const opens=raw.map(d=>d.o||null),highs=raw.map(d=>d.h||null),lows=raw.map(d=>d.l||null);
  const rv=calcRSI(closes),mv=calcMACD(closes),bv=calcBoll(closes);
  const s20=sma(closes,20),s50=sma(closes,50),s200=sma(closes,200);
  const last=closes.at(-1),chg=(last-closes.at(-2))/closes.at(-2)*100;
  const slice=closes.slice(-252),hi=Math.max(...slice),lo=Math.min(...slice),diff=hi-lo;
  const fib={hi,lo,r236:hi-diff*0.236,r382:hi-diff*0.382,r500:hi-diff*0.500,r618:hi-diff*0.618,r786:hi-diff*0.786};
  function perf(days){if(closes.length<=days)return null;const old=closes[closes.length-1-days];return{pct:(last-old)/old*100,abs:last-old};}
  return{raw,closes,opens,highs,lows,vols,rv,mv,bv,s20,s50,s200,last,chg,sig:calcSignal(rv,mv,last,bv),fib,
    perf1d:perf(1),perf1w:perf(5),perf1m:perf(21),perf3m:perf(63),perf6m:perf(126),perf1y:perf(252)};
}

function filterByRange(raw,range){
  if(range==="all")return raw;
  const cutoff=new Date();
  if(range==="1d")cutoff.setDate(cutoff.getDate()-1);
  else if(range==="1w")cutoff.setDate(cutoff.getDate()-7);
  else if(range==="1m")cutoff.setMonth(cutoff.getMonth()-1);
  else if(range==="3m")cutoff.setMonth(cutoff.getMonth()-3);
  else if(range==="6m")cutoff.setMonth(cutoff.getMonth()-6);
  else if(range==="1y")cutoff.setFullYear(cutoff.getFullYear()-1);
  const cutStr=cutoff.toISOString().slice(0,10);
  const f=raw.filter(d=>d.date>=cutStr);
  return f.length>1?f:raw.slice(-5);
}

// ── CHART ─────────────────────────────────────────────────────
function drawChart(canvasId,datasets,opts){
  opts=opts||{};
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth-16,H=opts.h||210;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";
  const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);
  const pl=54,pr=8,pt=10,pb=28,cw=W-pl-pr,ch=H-pt-pb;
  const allVals=datasets.flatMap(ds=>(ds.data||[]).filter(v=>v!=null&&isFinite(v)));
  if(!allVals.length)return;
  let mn=opts.yMin!=null?opts.yMin:Math.min(...allVals);
  let mx=opts.yMax!=null?opts.yMax:Math.max(...allVals);
  // Expand y-axis to include Fibonacci levels so they always show
  if(opts.fibRefs&&opts.fibRefs.length){
    const fv=opts.fibRefs.map(f=>f.v).filter(v=>v!=null&&isFinite(v));
    if(fv.length){mn=Math.min(mn,...fv);mx=Math.max(mx,...fv);}
  }
  const pad=(mx-mn)*0.04;mn-=pad;mx+=pad;
  const rng=mx-mn||1;
  const tx=(i,len)=>pl+i/(Math.max(len-1,1))*cw;
  const ty=v=>pt+ch-(v-mn)/rng*ch;
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  // Grid
  [0,.25,.5,.75,1].forEach(f=>{
    const y=pt+f*ch;
    ctx.strokeStyle="#f1f5f9";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(pl+cw,y);ctx.stroke();
    const val=mx-f*rng;
    ctx.fillStyle="#94a3b8";ctx.font="9px monospace";ctx.textAlign="right";
    ctx.fillText(opts.pct?val.toFixed(1):(val>100?val.toFixed(0):"$"+val.toFixed(2)),pl-4,y+3);
  });
  // Ref lines
  (opts.refs||[]).forEach(ref=>{
    const y=ty(ref.v);ctx.strokeStyle=ref.color;ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(pl+cw,y);ctx.stroke();ctx.setLineDash([]);
  });
  // Fibonacci lines — always draw (y-axis already includes them)
  (opts.fibRefs||[]).forEach(fib=>{
    const y=ty(fib.v);
    ctx.strokeStyle=fib.color+"90";ctx.lineWidth=1;ctx.setLineDash([5,3]);
    ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(pl+cw,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=fib.color;ctx.font="bold 8px monospace";ctx.textAlign="left";
    ctx.fillText(fib.label+" $"+fmtPrice(fib.v),pl+3,y-3);
  });
  // X labels
  const len=datasets.find(ds=>ds.data)?.data?.length||90;
  const lbls=datasets.find(ds=>ds.labels)?.labels||[];
  [0,Math.floor(len/4),Math.floor(len/2),Math.floor(3*len/4),len-1].forEach(i=>{
    if(lbls[i]){
      ctx.font="bold 9px monospace";ctx.fillStyle="#475569";ctx.textAlign="center";
      const cr=opts.chartRange||S.range;
      ctx.fillText((cr==="all"||cr==="1y")?lbls[i].slice(0,7):lbls[i].slice(5,10),tx(i,len),H-5);
    }
  });
  // Datasets
  datasets.forEach(ds=>{
    if(!ds.data)return;
    if(ds.type==="bar"){
      const bw=Math.max(1,cw/ds.data.length-1);
      ds.data.forEach((v,i)=>{
        if(v==null)return;
        const x=tx(i,ds.data.length),y0=ty(0),y1=ty(v);
        ctx.fillStyle=ds.colors?ds.colors[i]:(v>=0?"#3fb95060":"#f8514960");
        ctx.fillRect(x-bw/2,Math.min(y0,y1),bw,Math.abs(y1-y0));
      });
      if(opts.volAvg){const y=ty(opts.volAvg);ctx.strokeStyle="#6366f180";ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(pl+cw,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#6366f1";ctx.font="9px monospace";ctx.textAlign="left";ctx.fillText("Avg",pl+2,y-3);}
      return;
    }
    if(ds.fill&&ds.fillColor){
      ctx.beginPath();let st=false;
      ds.data.forEach((v,i)=>{if(v==null)return;const x=tx(i,ds.data.length),y=ty(v);st?ctx.lineTo(x,y):(ctx.moveTo(x,y),st=true);});
      ctx.lineTo(tx(ds.data.length-1,ds.data.length),pt+ch);ctx.lineTo(pl,pt+ch);ctx.closePath();
      ctx.fillStyle=ds.fillColor;ctx.fill();
    }
    ctx.beginPath();ctx.strokeStyle=ds.color||"#fff";ctx.lineWidth=ds.width||1.5;
    if(ds.dash)ctx.setLineDash(ds.dash);
    let st=false;
    ds.data.forEach((v,i)=>{if(v==null){st=false;return;}const x=tx(i,ds.data.length),y=ty(v);st?ctx.lineTo(x,y):(ctx.moveTo(x,y),st=true);});
    ctx.stroke();ctx.setLineDash([]);
  });
}

// ── DRAW CURRENT (FIXED 200 SMA + FIBONACCI) ─────────────────
function drawCurrent(){
  const d=S.stocks[S.active];if(!d)return;
  const rawData=(S.range==="1d"&&S.intraday[S.active])?S.intraday[S.active]:d.raw;
  const filtered=filterByRange(rawData,S.range);
  const closes=filtered.map(x=>x.c),labels=filtered.map(r=>r.date);

}

// ── CANDLESTICK CHART (legacy, unused) ───────────────────────
function drawCandlestick(canvasId,data,opts){
  opts=opts||{};
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth-16,H=opts.h||260;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";
  const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);
  const pl=60,pr=8,pt=10,pb=28,cw=W-pl-pr,ch=H-pt-pb;
  const valid=data.filter(d=>d.h!=null&&d.l!=null&&d.o!=null&&d.c!=null);
  if(!valid.length)return;
  let mn=Math.min(...valid.map(d=>d.l));
  let mx=Math.max(...valid.map(d=>d.h));
  if(opts.fibRefs&&opts.fibRefs.length){const fv=opts.fibRefs.map(f=>f.v).filter(v=>v!=null);if(fv.length){mn=Math.min(mn,...fv);mx=Math.max(mx,...fv);}}
  const pad=(mx-mn)*0.04;mn-=pad;mx+=pad;
  const rng=mx-mn||1;
  const tx=i=>pl+(i+0.5)/valid.length*cw;
  const ty=v=>pt+ch-(v-mn)/rng*ch;
  const bw=Math.max(1,cw/valid.length*0.65);
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  // Grid
  [0,.25,.5,.75,1].forEach(f=>{
    const y=pt+f*ch;ctx.strokeStyle="#f1f5f9";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(pl+cw,y);ctx.stroke();
    const val=mx-f*rng;ctx.fillStyle="#94a3b8";ctx.font="9px monospace";ctx.textAlign="right";
    ctx.fillText(val>100?val.toFixed(0):"$"+val.toFixed(2),pl-4,y+3);
  });
  // Fibonacci
  (opts.fibRefs||[]).forEach(fib=>{
    const y=ty(fib.v);ctx.strokeStyle=fib.color+"90";ctx.lineWidth=1;ctx.setLineDash([5,3]);
    ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(pl+cw,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=fib.color;ctx.font="bold 8px monospace";ctx.textAlign="left";
    ctx.fillText(fib.label+" $"+fmtPrice(fib.v),pl+3,y-3);
  });
  // Candles
  valid.forEach((d,i)=>{
    const x=tx(i),green=d.c>=d.o,col=green?"#10b981":"#ef4444";
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,ty(d.h));ctx.lineTo(x,ty(d.l));ctx.stroke();
    const bTop=ty(Math.max(d.o,d.c)),bBot=ty(Math.min(d.o,d.c)),bH=Math.max(1,bBot-bTop);
    ctx.fillStyle=green?"#10b98180":"#ef444480";ctx.fillRect(x-bw/2,bTop,bw,bH);
    ctx.strokeStyle=col;ctx.strokeRect(x-bw/2,bTop,bw,bH);
  });
  // X labels
  const step=Math.max(1,Math.floor(valid.length/5));
  ctx.fillStyle="#475569";ctx.font="bold 9px monospace";ctx.textAlign="center";
  valid.forEach((d,i)=>{
    if(i%step===0||i===valid.length-1){
      const cr=opts.chartRange||S.range;
      ctx.fillText((cr==="all"||cr==="1y")?d.date.slice(0,7):d.date.slice(5,10),tx(i),H-5);
    }
  });
}

function timeAgo(ts){
  const s=Math.floor(Date.now()/1000-ts);
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

// ── FEAR & GREED ──────────────────────────────────────────────
function fgiGaugeSVG(score, rating){
  const cx=115,cy=108,R=90,ri=60;
  const ZONES=[[0,25,"#d62b2b"],[25,45,"#e07020"],[45,55,"#e8b800"],[55,75,"#4db56a"],[75,100,"#2d8c4e"]];
  const ZONE_LABELS=["Extreme\nFear","Fear","Neutral","Greed","Extreme\nGreed"];
  const COL={"extreme fear":"#d62b2b","fear":"#e07020","neutral":"#e8b800","greed":"#4db56a","extreme greed":"#2d8c4e"}[rating.toLowerCase()]||"#64748b";
  function a(s){return Math.PI*(1-s/100);}
  function op(s){return[cx+R*Math.cos(a(s)),cy-R*Math.sin(a(s))];}
  function ip(s){return[cx+ri*Math.cos(a(s)),cy-ri*Math.sin(a(s))];}
  function arc(s1,s2,fill){
    const[ox1,oy1]=op(s1),[ox2,oy2]=op(s2),[ix2,iy2]=ip(s2),[ix1,iy1]=ip(s1);
    const lg=(s2-s1)*1.8>180?1:0;
    return `<path d="M${ox1.toFixed(1)} ${oy1.toFixed(1)} A${R} ${R} 0 ${lg} 1 ${ox2.toFixed(1)} ${oy2.toFixed(1)} L${ix2.toFixed(1)} ${iy2.toFixed(1)} A${ri} ${ri} 0 ${lg} 0 ${ix1.toFixed(1)} ${iy1.toFixed(1)} Z" fill="${fill}"/>`;
  }
  // Zone boundary ticks
  const ticks=[0,25,45,55,75,100].map(s=>{
    const ang=a(s);
    return `<line x1="${(cx+(R+1)*Math.cos(ang)).toFixed(1)}" y1="${(cy-(R+1)*Math.sin(ang)).toFixed(1)}" x2="${(cx+(ri-1)*Math.cos(ang)).toFixed(1)}" y2="${(cy-(ri-1)*Math.sin(ang)).toFixed(1)}" stroke="#fff" stroke-width="2.5"/>`;
  }).join("");
  // Zone labels inside arc
  const midR=(R+ri)/2;
  const zoneText=ZONES.map(([s1,s2,c],i)=>{
    const mid=(s1+s2)/2,ang=a(mid);
    const lx=(cx+midR*Math.cos(ang)).toFixed(1),ly=(cy-midR*Math.sin(ang)).toFixed(1);
    const rot=(90-ang*180/Math.PI).toFixed(1);
    const parts=ZONE_LABELS[i].split("\n");
    if(s2-s1<15) return "";
    return parts.length>1
      ?`<text text-anchor="middle" fill="white" font-size="6.5" font-weight="700" font-family="monospace" transform="rotate(${rot},${lx},${ly})"><tspan x="${lx}" dy="-4">${parts[0]}</tspan><tspan x="${lx}" dy="9">${parts[1]}</tspan></text>`
      :`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="7" font-weight="700" font-family="monospace" transform="rotate(${rot},${lx},${ly})">${parts[0]}</text>`;
  }).join("");
  // Score scale ticks on outside
  const scaleTicks=[0,25,50,75,100].map(s=>{
    const ang=a(s);
    const lx=(cx+(R+14)*Math.cos(ang)).toFixed(1),ly=(cy-(R+14)*Math.sin(ang)).toFixed(1);
    return `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#94a3b8" font-size="8" font-family="monospace">${s}</text>`;
  }).join("");
  // Needle
  const cs=Math.min(99,Math.max(1,score)),ang=a(cs);
  const nx=(cx+(R-8)*Math.cos(ang)).toFixed(1),ny=(cy-(R-8)*Math.sin(ang)).toFixed(1);
  // Base triangle for needle (wider at center)
  const baseAngle=ang+Math.PI/2;
  const bx1=(cx+7*Math.cos(baseAngle)).toFixed(1),by1=(cy-7*Math.sin(baseAngle)).toFixed(1);
  const bx2=(cx-7*Math.cos(baseAngle)).toFixed(1),by2=(cy+7*Math.sin(baseAngle)).toFixed(1);
  return `<svg viewBox="0 0 230 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:280px;display:block">
    ${ZONES.map(([s1,s2,c])=>arc(s1,s2,c)).join("")}
    ${ticks}
    ${zoneText}
    ${scaleTicks}
    <polygon points="${nx},${ny} ${bx1},${by1} ${bx2},${by2}" fill="#1e2a4a" opacity="0.9"/>
    <circle cx="${cx}" cy="${cy}" r="9" fill="#1e2a4a"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="white"/>
    <text x="${cx}" y="${cy-26}" text-anchor="middle" font-size="38" font-weight="800" fill="${COL}" font-family="Syne,sans-serif">${Math.round(score)}</text>
    <text x="${cx}" y="${cy-11}" text-anchor="middle" font-size="9.5" fill="${COL}" font-weight="700" font-family="monospace" letter-spacing="1">${rating.toUpperCase()}</text>
  </svg>`;
}

  const rc=lr<30?"#3fb950":lr>70?"#f85149":"#ffa502";
  const COMPARE_PICKS=["^GSPC","^IXIC","SPY","QQQ","BTC-USD","GLD","NVDA","META"].filter(t=>t!==S.active);

  el.innerHTML=
    // ── Title row
    `<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:24px;font-weight:800;font-family:'Syne',sans-serif;color:#1e2a4a;letter-spacing:-0.02em">${S.active}</div>
        ${NAMES[S.active]?`<div style="font-size:12px;color:#94a3b8;margin-top:1px">${NAMES[S.active]}</div>`:""}
        <div style="display:flex;align-items:baseline;gap:10px;margin-top:6px">
          <span style="font-size:22px;font-weight:800;color:#1e2a4a;font-family:'Syne',sans-serif">${fmtPrice(d.last)}</span>
          <span style="font-size:14px;font-weight:600;color:${d.chg>=0?"#10b981":"#ef4444"}">${d.chg>=0?"▲":"▼"} ${d.chg>=0?"+":""}${d.chg.toFixed(2)}%</span>
          <span style="font-size:9px;padding:2px 7px;border-radius:4px;background:${S.liveLoaded[S.active]?"#10b98115":"#f59e0b15"};color:${S.liveLoaded[S.active]?"#10b981":"#f59e0b"}">${S.liveLoaded[S.active]?"● live":"○ demo"}</span>
        </div>
      </div>
      <div style="background:${sig.c}15;border:1.5px solid ${sig.c}40;border-radius:12px;padding:10px 18px;text-align:center">
        <div style="font-size:18px;color:${sig.c};font-weight:800;font-family:'Syne',sans-serif">${sig.i} ${sig.s}</div>
        <div style="font-size:10px;color:#64748b;margin-top:3px;font-weight:600">SCORE ${sig.sc>0?"+":""}${sig.sc}</div>
      </div>
    </div>`
    // ── Signal tags
    +`<div style="margin-bottom:12px">${sig.rs.map(r=>`<span class="signal-tag">${r}</span>`).join("")}</div>`
    // ── 3 stat cards
    +`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px">
      <div class="stat-card">
        <div style="font-size:9px;color:#94a3b8;margin-bottom:6px;font-weight:700;letter-spacing:0.05em">RSI (14)</div>
        <div style="font-size:22px;font-weight:800;color:${rc}">${lr?lr.toFixed(1):"-"}</div>
        <div style="font-size:9px;color:#94a3b8;margin-top:2px">${lr<30?"oversold":lr>70?"overbought":"neutral"}</div>
      </div>
      <div class="stat-card">
        <div style="font-size:9px;color:#94a3b8;margin-bottom:6px;font-weight:700;letter-spacing:0.05em">MACD Hist.</div>
        <div style="font-size:20px;font-weight:800;color:${lm>0?"#10b981":"#ef4444"}">${lm?lm.toFixed(3):"-"}</div>
        <div style="font-size:9px;color:#94a3b8;margin-top:2px">${lm>0?"bullish":"bearish"} momentum</div>
      </div>
      <div class="stat-card">
        <div style="font-size:9px;color:#94a3b8;margin-bottom:6px;font-weight:700;letter-spacing:0.05em">BB Position</div>
        <div style="font-size:22px;font-weight:800;color:#6366f1">${bbpos}</div>
        <div style="font-size:9px;color:#94a3b8;margin-top:2px">of band width</div>
      </div>
    </div>`
    // ── SMA row
    +`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px">
      ${[{label:"SMA 20",val:d.s20.filter(Boolean).at(-1)},{label:"SMA 50",val:d.s50.filter(Boolean).at(-1)},{label:"SMA 200",val:d.s200.filter(Boolean).at(-1)}].map(({label,val})=>{
        const above=val&&d.last>val;
        return`<div class="stat-card">
          <div style="font-size:9px;color:#94a3b8;font-weight:700;letter-spacing:0.05em;margin-bottom:4px">${label}</div>
          <div style="font-size:13px;font-weight:700;color:#1e2a4a">${val?("$"+fmtPrice(val)):"-"}</div>
          <div style="font-size:9px;color:${above?"#10b981":"#ef4444"};font-weight:600;margin-top:2px">${val?(above?"▲ above":"▼ below"):""}</div>
        </div>`;
      }).join("")}
    </div>`
    // ── Volume row
    +(d.vols&&d.vols.at(-1)>0?`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px">
      <div class="stat-card"><div style="font-size:9px;color:#94a3b8;font-weight:700;margin-bottom:4px">VOLUME</div><div style="font-size:16px;font-weight:700;color:#1e2a4a">${fmtVol(d.vols.at(-1))}</div></div>
      <div class="stat-card"><div style="font-size:9px;color:#94a3b8;font-weight:700;margin-bottom:4px">VS 20D AVG</div>${(()=>{const avg=d.vols.slice(-20).reduce((a,b)=>a+b,0)/20;return avg>0?`<div style="font-size:16px;font-weight:700;color:${d.vols.at(-1)>avg?"#10b981":"#ef4444"}">${(d.vols.at(-1)/avg*100).toFixed(0)}%</div>`:'<div style="font-size:16px;color:#94a3b8">-</div>';})()}</div>
    </div>`:"")
    // ── Fibonacci table (when toggled)
    +(S.showFib&&d.fib?`<div class="stat-card" style="margin-bottom:8px">
      <div style="font-size:9px;color:#94a3b8;font-weight:700;letter-spacing:0.1em;margin-bottom:8px">⬡ FIBONACCI LEVELS — 52W Range</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
        ${[{l:"High",v:d.fib.hi,c:"#6366f1"},{l:".786",v:d.fib.r786,c:"#ef4444"},{l:".618",v:d.fib.r618,c:"#f97316"},
           {l:".500",v:d.fib.r500,c:"#f59e0b"},{l:".382",v:d.fib.r382,c:"#10b981"},{l:".236",v:d.fib.r236,c:"#06b6d4"},
           {l:"Low",v:d.fib.lo,c:"#8b5cf6"}].map(f=>{
          const near=Math.abs(d.last-f.v)/f.v<0.015;
          return`<div style="padding:6px 8px;border-radius:8px;background:${near?f.c+"20":"#f8faff"};border:1.5px solid ${near?f.c+"60":"#e2e8f8"}">
            <div style="font-size:8px;color:${f.c};font-weight:700">${f.l}</div>
            <div style="font-size:11px;font-weight:700;color:#1e2a4a">$${fmtPrice(f.v)}</div>
            ${near?`<div style="font-size:8px;color:${f.c};font-weight:600">← near</div>`:""}
          </div>`;
        }).join("")}
      </div>
    </div>`:"")
    // ── Tabs + Range + Fib button
    +`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">
      ${["price","candles","rsi","macd","vol","compare","news"].map(t=>{
        const l={"price":"Line+BB","candles":"Candles","rsi":"RSI","macd":"MACD","vol":"Volume","compare":"Compare","news":"News"}[t];
        return`<button class="tab-btn${S.tab===t?" active":""}" onclick="doTab('${t}')">${l}</button>`;
      }).join("")}
      <button onclick="doFib()" style="padding:5px 11px;border-radius:5px;font-size:10px;cursor:pointer;font-family:monospace;font-weight:600;border:1.5px solid ${S.showFib?"#f59e0b":"#e2e8f8"};background:${S.showFib?"linear-gradient(135deg,#f59e0b,#f97316)":"#fff"};color:${S.showFib?"#fff":"#64748b"}">⬡ Fib</button>
    </div>
    <div style="display:flex;gap:4px;margin-bottom:10px">
      ${["1d","1w","1m","3m","6m","1y","all"].map(r=>{
        const lbl={"1d":"1D","1w":"1W","1m":"1M","3m":"3M","6m":"6M","1y":"1Y","all":"Max"}[r];
        return`<button onclick="doRange('${r}')" style="padding:4px 10px;border-radius:8px;font-size:9px;cursor:pointer;font-family:monospace;border:1.5px solid ${S.range===r?"#6366f1":"#e2e8f8"};background:${S.range===r?"linear-gradient(135deg,#6366f1,#8b5cf6)":"#f8faff"};color:${S.range===r?"#fff":"#475569"};font-weight:600">${lbl}</button>`;
      }).join("")}
    </div>`
    // ── Performance banner
    +(()=>{
      const pm={"1d":d.perf1d,"1w":d.perf1w,"1m":d.perf1m,"3m":d.perf3m,"6m":d.perf6m,"1y":d.perf1y,"all":d.perf1y}[S.range];
      if(!pm)return"";
      const c=pm.pct>=0?"#10b981":"#ef4444",s=pm.pct>=0?"+":"",a=pm.pct>=0?"▲":"▼";
      const rl={"1d":"1D","1w":"1W","1m":"1M","3m":"3M","6m":"6M","1y":"1Y","all":"Max"}[S.range];
      return`<div style="display:flex;align-items:center;gap:10px;padding:8px 14px;background:${c}12;border:1.5px solid ${c}40;border-radius:10px;margin-bottom:10px">
        <span style="font-size:22px;font-weight:800;color:${c};font-family:'Syne',sans-serif">${a} ${s}${pm.pct.toFixed(2)}%</span>
        <span style="font-size:12px;color:${c}">${s}$${Math.abs(pm.abs).toFixed(2)}</span>
        <span style="font-size:10px;color:#94a3b8;margin-left:auto">${rl} Performance</span>
      </div>`;
    })()
    // ── Chart area
    +(S.tab==="news"?
      `<div class="stat-card" style="margin-bottom:14px"><div style="font-size:9px;color:#94a3b8;font-weight:700;letter-spacing:0.1em;margin-bottom:10px">⬡ LATEST NEWS — ${NAMES[S.active]||S.active}</div><div id="news-container"><div style="color:#94a3b8;font-size:12px">Loading...</div></div></div>`
      :S.tab==="compare"?
      `<div style="background:#fff;border:1.5px solid #e2e8f8;border-radius:16px;padding:10px;margin-bottom:14px">
        <div style="font-size:9px;color:#94a3b8;font-weight:700;margin-bottom:8px">RELATIVE PERFORMANCE — compare with:</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
          ${COMPARE_PICKS.map(t=>`<button onclick="doCompare('${t}')" style="padding:3px 9px;border-radius:6px;font-size:9px;cursor:pointer;font-family:monospace;border:1.5px solid ${S.compareWith===t?"#f97316":"#e2e8f8"};background:${S.compareWith===t?"#f9731615":"#fff"};color:${S.compareWith===t?"#f97316":"#475569"};font-weight:600">${t.replace("^","").replace("-USD","")}</button>`).join("")}
        </div>
        <div style="display:flex;gap:12px;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:4px"><div style="width:12px;height:3px;background:#6366f1;border-radius:2px"></div><span style="font-size:9px;color:#475569">${S.active}</span></div>
          ${S.compareWith?`<div style="display:flex;align-items:center;gap:4px"><div style="width:12px;height:3px;background:#f97316;border-radius:2px"></div><span style="font-size:9px;color:#475569">${S.compareWith}</span></div>`:""}
        </div>
        <canvas id="compareChart"></canvas>
      </div>`
      :(S.tab==="candles"||S.tab==="price")
      ?`<div style="background:#fff;border:1.5px solid #e2e8f8;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 8px rgba(99,102,241,0.06)"><div id="tv_widget" style="height:420px"></div></div>`
      :`<div style="background:#fff;border:1.5px solid #e2e8f8;border-radius:16px;padding:10px;margin-bottom:14px;box-shadow:0 2px 8px rgba(99,102,241,0.06)"><canvas id="chart"></canvas></div>`
    )
    // ── AI Analysis
    +`<div class="stat-card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:10px;color:#6366f1;letter-spacing:0.1em;font-weight:700">⬡ AI ANALYSIS</div>
        <button onclick="doAI()" ${S.aiLoading?"disabled":""} style="background:${S.aiLoading?"#e2e8f8":"linear-gradient(135deg,#6366f1,#8b5cf6)"};border:none;border-radius:6px;padding:5px 12px;font-size:10px;color:${S.aiLoading?"#94a3b8":"#fff"};font-weight:600;cursor:pointer">${S.aiLoading?"Analyzing...":"Analyze"}</button>
      </div>
      <div style="font-size:12px;color:${S.aiText?"#475569":"#94a3b8"};line-height:1.8;font-family:'Syne',sans-serif;font-style:${S.aiText?"normal":"italic"}">${S.aiText||"Click Analyze for an AI assessment of current technical indicators."}</div>
    </div>
    <div style="font-size:9px;color:#94a3b8;text-align:center;font-style:italic;padding-bottom:24px">For informational purposes only — not financial advice. Do your own research.</div>`;

  setTimeout(drawCurrent,50);
}

// ── ACTIONS ───────────────────────────────────────────────────
window.doSelect=async function(t){
  S.active=t;S.aiText="";S.tab="price";S.range="3m";
  closeMobileOverlay();
  renderSidebar();renderMain();renderOverview();
  if(!S.stocks[t]){
    const raw=await fetchStock(t);
    S.stocks[t]=processStock(raw||mock(t));
    renderSidebar();renderMain();renderOverview();
  }
};
window.doTab=async function(t){
  S.tab=t;renderMain();
  if(t==="price"){setTimeout(()=>initTVWidget(S.active,"3"),50);}
  if(t==="candles"){setTimeout(()=>initTVWidget(S.active,"1"),50);}
  if(t==="compare")setTimeout(drawCompareChart,100);
  if(t==="news")setTimeout(()=>loadNews(S.active),50);
};
window.doToggle=function(grp){S.collapsed[grp]=!S.collapsed[grp];renderSidebar();};
window.doFib=function(){S.showFib=!S.showFib;renderMain();};
window.doRange=async function(r){
  S.range=r;renderMain();
  if(r==="1d"&&!S.intraday[S.active]){const data=await fetchIntraday(S.active,"1d");if(data){S.intraday[S.active]=data;drawCurrent();}}
};
window.doAdd=function(){
  const v=(document.getElementById("ti")?.value||"").trim().toUpperCase();
  if(!v)return;
  if(!ALL.includes(v)&&!S.custom.includes(v))S.custom.push(v);
  doSelect(v);
};
window.doRemove=function(t){S.custom=S.custom.filter(x=>x!==t);if(S.active===t)doSelect(ALL[0]);else renderSidebar();};
window.doRefresh=async function(){
  const btn=document.getElementById("refreshBtn");
  if(btn)btn.style.animation="spin 0.6s linear";
  delete S.stocks[S.active];S.liveLoaded[S.active]=false;S.intraday[S.active]=null;
  renderMain();
  const raw=await fetchStock(S.active);
  if(raw){S.stocks[S.active]=processStock(raw);S.liveLoaded[S.active]=true;}
  renderMain();renderSidebar();renderOverview();
  if(btn){btn.style.animation="";setTimeout(()=>btn.style.animation="",700);}
};
window.openMobileOverlay=function(){
  const el=document.getElementById("mobile-overlay");if(!el)return;
  document.getElementById("mobile-sidebar-content").innerHTML=document.getElementById("sidebar").innerHTML;
  el.style.display="block";document.body.style.overflow="hidden";
};
window.closeMobileOverlay=function(){
  const el=document.getElementById("mobile-overlay");if(el)el.style.display="none";
  document.body.style.overflow="";
};
window.doCompare=function(t){
  S.compareWith=t;
  if(!S.stocks[t]){fetchStock(t).then(raw=>{S.stocks[t]=processStock(raw||mock(t));renderMain();setTimeout(drawCompareChart,50);});}
  else{renderMain();setTimeout(drawCompareChart,50);}
};
window.doAI=function(){
  const d=S.stocks[S.active];if(!d)return;
  const lr=d.rv.filter(Boolean).at(-1),lm=d.mv.hist.filter(Boolean).at(-1);
  const lb=d.bv.filter(b=>b.u).at(-1),sig=d.sig,lines=[];
  if(lr<30)lines.push(`RSI at ${lr.toFixed(1)} — strongly oversold. Historically a possible reversal signal.`);
  else if(lr<40)lines.push(`RSI at ${lr.toFixed(1)} — slightly oversold. Selling pressure is easing.`);
  else if(lr>70)lines.push(`RSI at ${lr.toFixed(1)} — strongly overbought. A correction may follow.`);
  else if(lr>60)lines.push(`RSI at ${lr.toFixed(1)} — slightly overbought. Strong momentum, caution advised.`);
  else lines.push(`RSI at ${lr.toFixed(1)} — neutral zone, no extreme signal.`);
  const pm=d.mv.hist.filter(Boolean).at(-2);
  if(pm!=null&&lm!=null){
    if(pm<0&&lm>0)lines.push("MACD crossover upward — bullish signal, possible start of an uptrend.");
    else if(pm>0&&lm<0)lines.push("MACD crossover downward — bearish signal, possible start of a downtrend.");
    else if(lm>0)lines.push(`MACD histogram positive (${lm.toFixed(4)}) — upward momentum active.`);
    else lines.push(`MACD histogram negative (${lm.toFixed(4)}) — downward momentum active.`);
  }
  if(lb){
    const pos=((d.last-lb.l)/(lb.u-lb.l)*100).toFixed(0);
    if(d.last<=lb.l)lines.push("Price at lower Bollinger Band — potential reversal zone, wait for confirmation.");
    else if(d.last>=lb.u)lines.push("Price at upper Bollinger Band — breakout or reversal possible.");
    else lines.push(`Price at ${pos}% of Bollinger Band — no extreme BB signal.`);
  }
  if(S.showFib&&d.fib){
    const lvls=[{l:".236",v:d.fib.r236},{l:".382",v:d.fib.r382},{l:".500",v:d.fib.r500},{l:".618",v:d.fib.r618},{l:".786",v:d.fib.r786}];
    for(const f of lvls){if(Math.abs(d.last-f.v)/f.v<0.015){lines.push(`Price near Fibonacci ${f.l} level ($${fmtPrice(f.v)}) — key support/resistance zone.`);break;}}
  }
  if(sig.s==="BULLISH")lines.push(`Overall: Multiple bullish signals active (score ${sig.sc}). Upside potential — always confirm with your own research.`);
  else if(sig.s==="BEARISH")lines.push(`Overall: Multiple bearish signals active (score ${sig.sc}). Caution advised.`);
  else lines.push(`Overall: Mixed signals (score ${sig.sc}). Wait for clearer confirmation before acting.`);
  S.aiText=lines.join(" ");renderMain();
};
window.addEventListener("resize",drawCurrent);

// ── LIVE STATUS ───────────────────────────────────────────────
function updateLiveStatus(text,color,pulse){
  const el=document.getElementById("liveStatus");if(!el)return;
  el.style.background=color+"20";el.style.color=color;
  el.innerHTML=`<div style="width:6px;height:6px;border-radius:50%;background:${color};${pulse?"animation:pulse 2s infinite":""}"></div><span>${text}</span>`;
}

// ── INIT ──────────────────────────────────────────────────────
(async function(){
  for(const t of ALL){S.stocks[t]=processStock(mock(t));}
  renderSidebar();renderMain();renderOverview();
  loadFGI();
  updateLiveStatus("Connecting...","#f59e0b",true);

  async function loadLive(t){
    const data=await fetchStock(t);
    if(data){
      S.stocks[t]=processStock(data);S.liveLoaded[t]=true;
      if(S.active===t)renderMain();
      if(OVERVIEW_TICKERS.includes(t))renderOverview();
      renderSidebar();return true;
    }
    return false;
  }

  const ok=await loadLive(S.active);
  if(ok){updateLiveStatus("Live","#10b981",true);}
  else{
    updateLiveStatus("Retrying...","#f59e0b",true);
    await new Promise(r=>setTimeout(r,8000));
    const ok2=await loadLive(S.active);
    updateLiveStatus(ok2?"Live":"Demo data",ok2?"#10b981":"#ef4444",ok2);
  }

  for(const t of ALL.filter(x=>x!==S.active)){await new Promise(r=>setTimeout(r,200));loadLive(t);}

  setInterval(async function(){
    S.intraday={};
    const fresh=await fetchStock(S.active);
    if(fresh){S.stocks[S.active]=processStock(fresh);S.liveLoaded[S.active]=true;renderMain();renderSidebar();renderOverview();}
    updateLiveStatus("Live — "+new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}),"#10b981",true);
  },5*60*1000);
})();
</script>
